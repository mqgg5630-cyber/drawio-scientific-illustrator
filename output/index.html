<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>机器学习筛选鲜味肽 · 可编辑插图</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #1f2937; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p.lead { margin: 0 0 24px; color: #475569; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .meta { color: #64748b; font-size: 13px; margin-bottom: 12px; }
  .card .meta a { color: #2563eb; text-decoration: none; margin-right: 12px; }
  .card .meta a:hover { text-decoration: underline; }
  .frame-wrap { overflow: auto; max-height: 80vh; border: 1px dashed #cbd5e1; border-radius: 4px; }
  object { display: block; background: #fff; }
  .downloads { margin-top: 8px; }
  .downloads a { display: inline-block; padding: 6px 12px; margin-right: 8px; margin-top: 6px; background: #0F2C4D; color: #fff; border-radius: 4px; text-decoration: none; font-size: 13px; }
  .downloads a.alt { background: #1F7A1F; }
  .downloads a:hover { opacity: .9; }
  .legend { font-size: 12px; color: #64748b; margin-top: 8px; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>机器学习辅助筛选鲜味肽 · 可编辑插图</h1>
  <p class="lead">下面两张图都基于同一份 <code>.drawio</code> 源文件，每一条形状/文字/连线都是独立可编辑的节点。下载 <code>.drawio</code> 后用 draw.io 桌面版继续编辑；<code>.svg</code> 可直接在 Inkscape / Illustrator / 浏览器中打开，每个元素都带有 <code>data-mx-id</code>。</p>

  <div class="grid">
    <div class="card">
      <h2>主图预览（SVG）</h2>
      <div class="meta">1800 × 1200 · 68 个形状节点 + 35 条连线 + 35 个独立 mxCell</div>
      <div class="frame-wrap">
        <object id="svgObj" data="umami-peptide-ml.svg" type="image/svg+xml" width="1800" height="1200"></object>
      </div>
      <div class="downloads">
        <a href="umami-peptide-ml.drawio" download>下载 .drawio 源文件（推荐，可继续编辑）</a>
        <a class="alt" href="umami-peptide-ml.svg" download>下载 .svg</a>
      </div>
      <div class="legend">提示：在 draw.io 中打开后，可点击任意形状、文字、箭头独立修改样式或位置。</div>
    </div>
  </div>
</body>
</html>
